<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="container py-4">
  <h1 class="text-center mb-4">Gestor de Clientes</h1>

  <form id="formCliente" class="row g-3">
    <div class="col-md-6">
      <input type="number" id="id" class="form-control" placeholder="ID" required />
    </div>
    <div class="col-md-6">
      <input type="text" id="nombre" class="form-control" placeholder="Nombre" required />
    </div>
    <div class="col-md-6">
      <input type="text" id="apellido" class="form-control" placeholder="Apellido" required />
    </div>
    <div class="col-md-6">
      <input type="email" id="email" class="form-control" placeholder="Email" required />
    </div>
    <div class="col-md-6">
      <input type="tel" id="telefono" class="form-control" placeholder="Teléfono" required />
    </div>
    <div class="col-md-6">
      <select id="activo" class="form-select">
        <option value="true">Activo</option>
        <option value="false">Inactivo</option>
      </select>
    </div>
    <div class="col-12 d-grid">
      <button type="submit" class="btn btn-success">Agregar Cliente</button>
    </div>
  </form>

  <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-center">
    <button onclick="mostrarClientes()" class="btn btn-primary">Mostrar Todos</button>
    <button onclick="mostrarActivos()" class="btn btn-info text-white">Activos</button>
    <button onclick="mostrarInactivos()" class="btn btn-warning text-dark">Inactivos</button>
    <button onclick="buscarClientePorId()" class="btn btn-danger">Buscar por ID</button>
    <button onclick="contarClientesActivos()" class="btn btn-dark">Contar Activos</button>
    <button onclick="mostrarModalEliminar()" class="btn btn-outline-danger">Eliminar por ID</button>
    <button onclick="mostrarModalEditar()" class="btn btn-outline-primary">Editar Cliente</button>
    <button onclick="unirClientesConNuevos()" class="btn btn-outline-success">Unir Nuevos Clientes</button>
    <button onclick="mostrarWhileModal()" class="btn btn-outline-dark">Validar ID (while)</button>
  </div>

  <div id="resultado" class="mt-4"></div>
</div>

<!-- Footer -->
<footer class="footer bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2025 Gestor de Clientes | Desarrollado por Magdalena Inalaf G. Para fines académicos.</p>
</footer>

<!-- Modal -->
<div class="modal fade" id="modalMensaje" tabindex="-1" aria-labelledby="modalMensajeLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalMensajeLabel">Mensaje</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modalMensajeBody">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
<!-- Modal para buscar por ID -->
<div class="modal fade" id="modalBuscarId" tabindex="-1" aria-labelledby="modalBuscarIdLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formBuscarId">
        <div class="modal-header">
          <h5 class="modal-title" id="modalBuscarIdLabel">Buscar Cliente por ID</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="number" id="inputBuscarId" class="form-control" placeholder="Ingrese ID del cliente" required />
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Buscar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Modal para eliminar cliente -->
<div class="modal fade" id="modalEliminarId" tabindex="-1" aria-labelledby="modalEliminarIdLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEliminarId">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEliminarIdLabel">Eliminar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="number" id="inputEliminarId" class="form-control" placeholder="Ingrese ID del cliente a eliminar" required />
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Eliminar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Modal para editar cliente -->
<div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="modalEditarClienteLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEditarCliente">
        <div class="modal-header">
          <h5 class="modal-title" id="modalEditarClienteLabel">Editar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="number" id="editarId" class="form-control mb-2" placeholder="ID del cliente" required />
          <input type="tel" id="editarTelefono" class="form-control mb-2" placeholder="Nuevo teléfono" required />
          <select id="editarActivo" class="form-select">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Guardar cambios</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal para ciclo while: Validar ID -->
<div class="modal fade" id="modalValidarWhile" tabindex="-1" aria-labelledby="modalValidarWhileLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formValidarWhile">
        <div class="modal-header">
          <h5 class="modal-title" id="modalValidarWhileLabel">Buscar Cliente por ID (while)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="number" id="inputWhileId" class="form-control" placeholder="Ingrese ID válido" required />
          <div id="mensajeWhile" class="mt-2 text-danger"></div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Validar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
